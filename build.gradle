plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

group = 'com.github.bitsoex'
version = '4.3.0'

description = "bitso-java"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

repositories {
    maven {
        url = "https://repo.maven.apache.org/maven2/"
    }
}

dependencies {
    api 'org.apache.httpcomponents.client5:httpclient5:5.6.4'
    api 'org.json:json:20260814'
    api 'io.netty:netty-all:4.2.18.Final'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
}

test.useJUnitPlatform()

java {
    withJavadocJar()
    withSourcesJar()
}

// To specify a license in the pom:
publishing {
    publications {
        maven(MavenPublication) {
            pom {
                name = 'Bitso REST API Client'
                licenses {
                    license {
                        name = 'The MIT License (MIT)'
                        url = 'https://github.com/bitsoex/bitso-java/blob/master/LICENSE'
                        distribution = 'repo'
                    }
                }
            }
            from components.java
        }
    }
}
